<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Dictionary Lookup Settings</title>
    <style>
        :root{
            --dg-page:#faf9f6;--dg-surface:#ffffff;--dg-surface-hover:#f5f4f1;
            --dg-border:#e7e5de;--dg-border-strong:#d7d4c9;
            --dg-text:#1b1d19;--dg-text-2:#5c6058;--dg-text-muted:#6e716a;
            --dg-navy:#243448;
            --dg-accent:#149c7c;--dg-accent-ink:#0f7c63;--dg-accent-bg:#dff3ec;
            --dg-danger:#a8341c;--dg-danger-bg:#fbe9e5;
            --dg-font:"Lato","Segoe UI","Helvetica Neue",Arial,sans-serif;
            --dg-radius:12px;--dg-ease:cubic-bezier(.22,.68,0,1);
            --dg-shadow:0 10px 30px rgba(27,29,25,.08);
        }
        @media (prefers-color-scheme: dark){
            :root{
                --dg-page:#111111;--dg-surface:#191919;--dg-surface-hover:#202020;
                --dg-border:#2c2c2c;--dg-border-strong:#3b3b3b;
                --dg-text:#dddddd;--dg-text-2:#a8a8a8;--dg-text-muted:#8a8a8a;
                --dg-navy:#a9c4dc;
                --dg-accent:#16b394;--dg-accent-ink:#3fd6b6;--dg-accent-bg:#12241f;
                --dg-danger:#ff6b45;--dg-danger-bg:#2a1712;
                --dg-shadow:0 10px 30px rgba(0,0,0,.4);
            }
        }
        *{box-sizing:border-box}
        body{
            font-family:var(--dg-font);
            background:var(--dg-page);
            color:var(--dg-text);
            margin:0;
            padding:28px 20px 40px;
            font-size:14px;
            line-height:1.5;
        }
        .wrap{max-width:440px;margin:0 auto}
        .brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
        .brand img{width:34px;height:34px;border-radius:50%;flex:none}
        .brand .name{font-weight:700;font-size:16px;letter-spacing:-.01em}
        .brand .sub{font-size:12px;color:var(--dg-text-muted)}
        .card{
            background:var(--dg-surface);
            border:1px solid var(--dg-border);
            border-radius:var(--dg-radius);
            box-shadow:var(--dg-shadow);
            padding:22px;
            margin-bottom:16px;
        }
        .hint{
            display:flex;gap:10px;
            background:var(--dg-surface-hover);
            border:1px solid var(--dg-border);
            border-radius:10px;
            padding:12px 14px;
            font-size:12.5px;
            color:var(--dg-text-2);
            margin-bottom:18px;
        }
        .hint code{
            background:var(--dg-border);
            border-radius:4px;
            padding:1px 5px;
            font-size:11.5px;
        }
        .hint b{color:var(--dg-text)}
        .form-group{margin-bottom:6px}
        label{
            display:block;
            margin-bottom:8px;
            font-weight:700;
            font-size:12.5px;
            letter-spacing:.01em;
            color:var(--dg-text)
        }
        select, input[type="text"]{
            width:100%;
            padding:11px 12px;
            border:1px solid var(--dg-border-strong);
            border-radius:9px;
            box-sizing:border-box;
            font-size:13.5px;
            font-family:inherit;
            color:var(--dg-text);
            background:var(--dg-surface);
            margin-bottom:10px;
            transition:border-color .15s var(--dg-ease), box-shadow .15s var(--dg-ease);
        }
        select:focus, input[type="text"]:focus{
            outline:none;
            border-color:var(--dg-accent);
            box-shadow:0 0 0 3px var(--dg-accent-bg);
        }
        .custom-url-container{display:none;margin-top:2px}
        .actions{display:flex;gap:10px;margin-top:4px}
        button{
            font-family:inherit;
            font-size:13.5px;
            font-weight:700;
            padding:11px 18px;
            border-radius:9px;
            cursor:pointer;
            border:1px solid transparent;
            transition:background .15s var(--dg-ease), border-color .15s var(--dg-ease), color .15s var(--dg-ease);
        }
        #save{
            background:var(--dg-accent);
            color:#fff;
            flex:1;
        }
        #save:hover{background:var(--dg-accent-ink)}
        #reset{
            background:none;
            border-color:var(--dg-border-strong);
            color:var(--dg-text-2);
        }
        #reset:hover{border-color:var(--dg-danger);color:var(--dg-danger)}
        #status{
            margin-top:14px;
            padding:10px 14px;
            border-radius:9px;
            display:none;
            font-size:12.5px;
            font-weight:600;
        }
        .success{background:var(--dg-accent-bg);color:var(--dg-accent-ink)}
        .error{background:var(--dg-danger-bg);color:var(--dg-danger)}
        .footer{
            text-align:center;
            font-size:11.5px;
            color:var(--dg-text-muted);
        }
        .footer a{color:var(--dg-text-2);text-decoration:none}
        .footer a:hover{color:var(--dg-accent-ink);text-decoration:underline}
    </style>
</head>
<body>
    <div class="wrap">
        <div class="brand">
            <img src="dg-logo.svg" alt="">
            <div>
                <div class="name">Dhamma.gift</div>
                <div class="sub">Dictionary Lookup Settings</div>
            </div>
        </div>

        <div class="card">
            <div class="hint">
                <div>
                    To enable or edit hotkeys, go to <b>chrome://extensions/shortcuts</b><br>
                    The option below sets the <b>default</b> lookup mode. To switch language temporarily, use the <b>en/ru</b> button on the page &mdash; the choice is remembered automatically.
                </div>
            </div>

            <div class="form-group">
                <label for="urlPreset">Dictionary lookup mode</label>
                <select id="urlPreset">
                    <option value="newWindowExt">English - New Window (default)</option>
                    <option value="https://dict.dhamma.gift/?silent&q=">English - Popup</option>
                    <option value="https://dict.dhamma.gift/gd?search=">English - Compact</option>
                    <option value="sidePanelExt">English - Side Panel</option>
                    <option value="newWindowRuExt">Russian - New Window</option>
                    <option value="https://dict.dhamma.gift/ru/?silent&q=">Russian - Popup</option>
                    <option value="https://dict.dhamma.gift/ru/gd?search=">Russian - Compact</option>
                    <option value="sidePanelRuExt">Russian - Side Panel</option>
                    <option value="dharmamitra">Dharmamitra (New Window)</option>
                    <option value="goldendict://">GoldenDict-NG</option>
                    <option value="dttp://app.dicttango/WordLookup?word=">DictTango App</option>
                    <option value="mdict://mdict.cn/search?text=">MDict (macOS)</option>
                    <option value="custom">Custom URL...</option>
                </select>
                <div id="customUrlContainer" class="custom-url-container">
                    <label for="customUrl">Custom URL</label>
                    <input type="text" id="customUrl" value="https://dict.dhamma.gift/ru/?silent&q=" placeholder="https://dict.dhamma.gift/ru/?silent&q=">
                </div>
            </div>

            <div class="actions">
                <button id="reset">Reset</button>
                <button id="save">Save Settings</button>
            </div>

            <div id="status"></div>
        </div>

        <div class="footer">
            <a href="https://dict.dhamma.gift" target="_blank" rel="noopener">dict.dhamma.gift</a>
        </div>
    </div>

    <script src="options.js"></script>
</body>
</html>
