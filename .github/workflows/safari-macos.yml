name: Build macOS Safari Extension

on:
  push:
    paths:
      # Any version: the folder is renamed on every release, and a pinned name broke the build (0.5.8 -> 0.6.0).
      - 'browser-extention/dictLookup-extention-*-safari/**'
      - '.github/workflows/safari-macos.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Upload to App Store Connect (TestFlight)'
        type: boolean
        default: false

env:
  APP_NAME: Dhamma.gift Dictionary
  BUNDLE_ID: gift.dhamma.dictlookup

jobs:
  build:
    # Runs on every push — no signing, no secrets needed. Verifies the
    # safari-web-extension-converter + xcodebuild step doesn't rot, same
    # purpose as dg-app-full's ios-build job.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Locate the Safari extension source
        # Newest dictLookup-extention-<version>-safari folder; its manifest version becomes MARKETING_VERSION.
        run: |
          EXT_SOURCE=$(ls -d browser-extention/dictLookup-extention-*-safari | sort -V | tail -1)
          EXT_VERSION=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$EXT_SOURCE/manifest.json")
          echo "EXT_SOURCE=$EXT_SOURCE" >> "$GITHUB_ENV"
          echo "EXT_VERSION=$EXT_VERSION" >> "$GITHUB_ENV"
          echo "Source: $EXT_SOURCE, version $EXT_VERSION"

      - name: Convert Web Extension to an Xcode project
        run: |
          xcrun safari-web-extension-converter "$EXT_SOURCE" \
            --project-location build/safari \
            --app-name "$APP_NAME" \
            --bundle-identifier "$BUNDLE_ID" \
            --swift --macos-only --no-open --force

      - name: Force bundle identifiers to match the registered App Store Connect app
        run: |
          cd "build/safari/$APP_NAME"
          # safari-web-extension-converter's --bundle-identifier is NOT the final bundle
          # ID — it's treated as an org prefix, and the tool appends its own app-name-
          # derived suffix (e.g. BUNDLE_ID=gift.dhamma.dictlookup became
          # gift.dhamma.Dhamma-gift-Dictionary). App Store Connect only has an app record
          # for the exact BUNDLE_ID, so exportArchive fails with
          # DistributionAppRecordProviderError.missingApp. Rewrite whatever
          # PRODUCT_BUNDLE_IDENTIFIER the converter picked back to ours, keeping the
          # .Extension suffix distinction it already established between the two targets.
          PBXPROJ=$(find . -name project.pbxproj)
          python3 - "$PBXPROJ" "$BUNDLE_ID" <<'PY'
          import re, sys
          path, bundle_id = sys.argv[1], sys.argv[2]
          text = open(path).read()
          def repl(m):
              suffix = '.Extension' if m.group(1).strip('"').endswith('.Extension') else ''
              return f'PRODUCT_BUNDLE_IDENTIFIER = {bundle_id}{suffix};'
          text = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = ([^;]+);', repl, text)
          open(path, 'w').write(text)
          PY
          grep -n PRODUCT_BUNDLE_IDENTIFIER "$PBXPROJ"

      - name: Discover Xcode scheme
        id: scheme
        run: |
          cd "build/safari/$APP_NAME"
          ls -la
          # No -project flag: xcodebuild auto-finds the one project in the current
          # directory, same as the plain `xcodebuild -scheme ... build` call below does —
          # an explicit `-project "$(ls *.xcodeproj)"` here failed ("project.pbxproj does
          # not exist") even though that auto-discovery works fine.
          xcodebuild -list -json > /tmp/schemes.json
          cat /tmp/schemes.json
          SCHEME=$(python3 -c "
          import json
          d = json.load(open('/tmp/schemes.json'))
          schemes = d['project']['schemes']
          print(next((s for s in schemes if 'extension' not in s.lower()), schemes[0]))
          ")
          echo "Selected scheme: $SCHEME"
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build (unsigned)
        run: |
          cd "build/safari/$APP_NAME"
          # -derivedDataPath pins the output under the checkout — without it xcodebuild
          # writes to ~/Library/Developer/Xcode/DerivedData instead, which is why the
          # upload step below found nothing (it succeeded but silently uploaded 0 files).
          xcodebuild -scheme "${{ steps.scheme.outputs.name }}" -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO build

      - name: Upload unsigned .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: safari-extension-app-unsigned
          path: build/safari/${{ env.APP_NAME }}/DerivedData/Build/Products/Release/*.app
          if-no-files-found: error
          retention-days: 14

  release:
    # Signed archive + App Store Connect upload. Only runs when explicitly
    # asked for (workflow_dispatch with release=true) — same guard-and-skip
    # pattern as dg-app-full's ios-release, so a plain push never touches
    # Apple credentials.
    if: github.event_name == 'workflow_dispatch' && inputs.release == true
    runs-on: macos-15
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Locate the Safari extension source
        # Newest dictLookup-extention-<version>-safari folder; its manifest version becomes MARKETING_VERSION.
        run: |
          EXT_SOURCE=$(ls -d browser-extention/dictLookup-extention-*-safari | sort -V | tail -1)
          EXT_VERSION=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$EXT_SOURCE/manifest.json")
          echo "EXT_SOURCE=$EXT_SOURCE" >> "$GITHUB_ENV"
          echo "EXT_VERSION=$EXT_VERSION" >> "$GITHUB_ENV"
          echo "Source: $EXT_SOURCE, version $EXT_VERSION"

      - name: Check required secrets are present
        id: secrets_check
        run: |
          if [ -z "${{ secrets.ASC_KEY_P8 }}" ] || [ -z "${{ secrets.ASC_KEY_ID }}" ] || \
             [ -z "${{ secrets.ASC_ISSUER_ID }}" ] || [ -z "${{ secrets.APPLE_TEAM_ID }}" ] || \
             [ -z "${{ secrets.MACOS_DIST_CERT_P12 }}" ] || [ -z "${{ secrets.MACOS_DIST_CERT_PASSWORD }}" ]; then
            echo "Missing ASC_KEY_P8 / ASC_KEY_ID / ASC_ISSUER_ID / APPLE_TEAM_ID / MACOS_DIST_CERT_P12 / MACOS_DIST_CERT_PASSWORD — \
                  add them to this repo's secrets (same values as dg-app-full) before releasing." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Convert Web Extension to an Xcode project
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          xcrun safari-web-extension-converter "$EXT_SOURCE" \
            --project-location build/safari \
            --app-name "$APP_NAME" \
            --bundle-identifier "$BUNDLE_ID" \
            --swift --macos-only --no-open --force

      - name: Force bundle identifiers to match the registered App Store Connect app
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          cd "build/safari/$APP_NAME"
          # See the same-named step in the build job for why this is needed:
          # safari-web-extension-converter ignores --bundle-identifier as a literal ID
          # and derives its own from the app name instead, which App Store Connect
          # doesn't have an app record for.
          PBXPROJ=$(find . -name project.pbxproj)
          python3 - "$PBXPROJ" "$BUNDLE_ID" <<'PY'
          import re, sys
          path, bundle_id = sys.argv[1], sys.argv[2]
          text = open(path).read()
          def repl(m):
              suffix = '.Extension' if m.group(1).strip('"').endswith('.Extension') else ''
              return f'PRODUCT_BUNDLE_IDENTIFIER = {bundle_id}{suffix};'
          text = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = ([^;]+);', repl, text)
          open(path, 'w').write(text)
          PY
          grep -n PRODUCT_BUNDLE_IDENTIFIER "$PBXPROJ"

      - name: Discover Xcode scheme
        id: scheme
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          cd "build/safari/$APP_NAME"
          xcodebuild -list -json > /tmp/schemes.json
          cat /tmp/schemes.json
          SCHEME=$(python3 -c "
          import json
          d = json.load(open('/tmp/schemes.json'))
          schemes = d['project']['schemes']
          print(next((s for s in schemes if 'extension' not in s.lower()), schemes[0]))
          ")
          echo "Selected scheme: $SCHEME"
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Write App Store Connect API key
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Import distribution certificates
        if: steps.secrets_check.outputs.ready == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_DIST_CERT_P12 }}
          CERT_PASS: ${{ secrets.MACOS_DIST_CERT_PASSWORD }}
        run: |
          # The runner is ephemeral, so a throwaway keychain is enough (no cleanup step).
          # .p12 holds Apple Distribution + Mac Installer Distribution certs and their private key.
          KC="$RUNNER_TEMP/dist.keychain-db"
          KC_PASS=$(uuidgen)
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$CERT_PASS" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$KC"

      - name: Archive
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          cd "build/safari/$APP_NAME"
          xcodebuild -scheme "${{ steps.scheme.outputs.name }}" -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            INFOPLIST_KEY_LSApplicationCategoryType=public.app-category.reference \
            MARKETING_VERSION=$EXT_VERSION \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            archive

      - name: Export & upload to App Store Connect
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          cd "build/safari/$APP_NAME"
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          PLIST
          set +e
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -exportOptionsPlist ExportOptions.plist \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            -verbose 2>&1 \
            | tee macos-export.log
          echo "--- xcdistributionlogs (the real error usually hides here) ---"
          find /var/folders -iname "*.xcdistributionlogs" 2>/dev/null | while read -r d; do
            find "$d" -type f \( -name "*.log" -o -name "*.txt" \) -exec sh -c 'echo "== {} =="; cat "{}"' \;
          done
          set -e
          grep -q "Upload succeeded" macos-export.log
